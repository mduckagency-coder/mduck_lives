name: mduck_lives
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  image: ^4.2.0
  cupertino_icons: ^1.0.8
  firebase_core: ^3.1.0
  flutter_riverpod: ^3.3.2
  supabase_flutter: ^2.6.0
  video_player: ^2.9.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  youtube_player_flutter: ^10.0.1
  shared_preferences: ^2.5.5
  gal: ^2.3.3
  url_launcher: ^6.3.2
  flutter_web_auth_2: ^5.1.0
  image_picker: ^1.2.3
  package_info_plus: ^9.0.1
  flutter_widget_from_html_core: ^0.17.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

# Icone do app = arte mestre do painel web (Icone do Aplicativo).
# Pra trocar: salve a nova arte em assets/icon/app_icon_src.jpeg e rode
#   dart run tool/build_app_icon.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#4a23a5"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  # a margem de seguranca ja esta na arte (tool/build_app_icon.dart): sem recuo extra
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

# Tela de abertura nativa (aparece antes do Flutter carregar).
# Depois de mudar algo aqui, rode: dart run flutter_native_splash:create
flutter_native_splash:
  background_image: assets/splash/splash_fundo.png
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  # Android 12+ so aceita um icone central sobre cor solida.
  android_12:
    image: assets/splash/splash_android12.png
    color: "#0A0114"
    icon_background_color: "#0A0114"

flutter:
  uses-material-design: true
  assets:
    - assets/videos/LogoMduck.png
    - assets/videos/LogoMduck_crop.png
    - assets/splash/splash.jpg
    - assets/splash/logo_mduck_recortado.png
    - assets/academy/gifts/

